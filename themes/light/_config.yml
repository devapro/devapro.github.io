# Cache-busting version appended to css/style.css (?v=).
# Bump this on every style change so browsers fetch the new file.
version: 4

menu:
  Home: /
  Archives: archives

widgets:
#- search
- category
- tag
- archive

excerpt_link: Read More

# Optional default og:image for pages without a `cover:` frontmatter field (site path or URL).
cover:

# Adds twitter:site to page metadata.
twitter:
  username:

# GA4 measurement ID (G-XXXXXXX).
google_analytics:

comment_provider:
# Disqus comment
disqus_shortname:
# Facebook comment
facebook:
  appid: # <appId>
  comment_count: 5
  comment_width: 840
  comment_colorscheme: light